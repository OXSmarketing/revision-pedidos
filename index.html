<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root {
    --papel: #ffffff;
    --fondo: #f3f4f6;
    --tinta: #000000;
    --suave: #5b6168;
    --linea: #d9dce0;
    --rojo: #d7141a;
    --ok: #1d8a3a;
    --ok-claro: #e3f4e8;
    --parcial: #e8a200;
    --parcial-claro: #fff4d6;
    --error-claro: #fde4e4;
    --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --texto: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 16px; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }

  .barra { background: var(--tinta); color: #fff; padding: 12px 14px; }
  .zona-fija { position: sticky; top: 0; z-index: 15; background: var(--fondo); margin: -12px -12px 10px; padding: 8px 12px 8px; box-shadow: 0 3px 8px rgba(0,0,0,.14); }
  body.revisando { overflow: hidden; }
  body.revisando .barra { display: none; }
  body.revisando main#app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding: 0; max-width: none; display: flex; flex-direction: column; }
  body.revisando .zona-fija { position: static; margin: 0; flex: none; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  body.revisando #desplazable { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 96px; }
  .zona-fija > *, #desplazable > * { max-width: 720px; margin-left: auto; margin-right: auto; }
  .zona-fija .doc .salir { border: 1px solid var(--tinta); background: var(--papel); font-size: 13px; font-weight: 600; padding: 4px 10px; margin-top: 4px; }
  .leer { display: block; width: 100%; margin: 0 0 6px; padding: 14px; border: 0; background: var(--tinta); color: #fff; font-family: var(--cond); font-size: 22px; letter-spacing: .5px; }
  .leer.activo { background: var(--rojo); }
  .leer:disabled { opacity: .5; }
  .zona-fija .doc { margin-bottom: 6px; }
  .zona-fija .doc h1 { font-size: 22px; }
  .zona-fija .doc .total { font-size: 28px; }
  .zona-fija .progreso { margin-bottom: 6px; }
  .zona-fija .revisor { margin: 0 0 6px; }
  .zona-fija .franja-sobra { margin-bottom: 6px; padding: 6px 10px; }
  .zona-fija .escaner { margin-bottom: 6px; padding: 6px; }
  .zona-fija .aviso { margin-bottom: 0; min-height: 0; padding: 8px 10px; }
  .zona-fija .aviso .t { font-size: 19px; }
  .zona-fija .aviso .d { font-size: 13px; margin-top: 2px; }
  .barra .marca { font-family: var(--cond); font-size: 22px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .barra .marca span { background: var(--rojo); padding: 0 6px; }
  .buscar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; }
  .tipo { display: flex; border: 1px solid #fff; }
  .tipo button { background: transparent; color: #fff; border: 0; padding: 0 10px; font-weight: 600; }
  .tipo button.activo { background: #fff; color: var(--tinta); }
  .buscar input { width: 100%; border: 0; padding: 12px; font-size: 18px; font-weight: 600; min-width: 0; }
  .buscar .ir { background: var(--rojo); color: #fff; border: 0; padding: 0 16px; font-weight: 600; }

  .modos { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 10px; border: 1px solid #fff; }
  .modos button { background: transparent; color: #fff; border: 0; padding: 9px; font-weight: 600; }
  .modos button.activo { background: var(--rojo); }
  .buscar-bodega .ir { width: 100%; padding: 12px; background: var(--rojo); color: #fff; border: 0; font-weight: 600; }
  .pedidos { background: var(--papel); border: 1px solid var(--linea); }
  .pedido { display: block; width: 100%; text-align: left; background: var(--papel); border: 0; border-bottom: 1px solid var(--linea); padding: 14px; }
  .pedido:last-child { border-bottom: 0; }
  .pedido .n { font-weight: 600; }
  .pedido .v { font-size: 14px; color: var(--suave); margin-top: 2px; }
  .resultado { margin-top: 12px; font-size: 15px; }
  .resultado a { color: var(--tinta); font-weight: 600; }
  .pallets { background: var(--papel); border: 2px solid var(--tinta); padding: 10px; margin: 0 0 10px; }
  .pallet-actual { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
  .miniatura { width: 56px; height: 56px; background: var(--fondo); border: 1px dashed var(--suave); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--suave); text-align: center; overflow: hidden; }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; }
  .pallet-actual .n { font-family: var(--cond); font-size: 22px; line-height: 1; }
  .pallet-actual .v { font-size: 13px; color: var(--suave); }
  .pallet-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .pallet-botones button { padding: 11px 8px; font-weight: 600; border: 1px solid var(--tinta); background: var(--papel); }
  .pallet-botones .foto { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .pallet-botones .foto.lista { background: var(--ok); border-color: var(--ok); }
  .conteo { margin-top: 10px; padding: 8px 10px; font-size: 14px; background: var(--fondo); border-left: 6px solid var(--linea); }
  .conteo.ok { border-color: var(--ok); background: var(--ok-claro); }
  .conteo.error { border-color: var(--rojo); background: var(--error-claro); }
  .conteo button { margin-left: 6px; border: 1px solid var(--tinta); background: var(--papel); padding: 3px 8px; font-weight: 600; }
  details.bultos { margin-top: 10px; }
  details.bultos summary { font-weight: 600; cursor: pointer; padding: 4px 0; }
  .bulto { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--linea); font-size: 14px; }
  .bulto .num { font-family: var(--cond); font-size: 18px; color: var(--suave); }
  .bulto .acciones button { width: 34px; height: 32px; }
  .bulto .u { font-family: var(--cond); font-size: 20px; min-width: 34px; text-align: center; display: inline-block; }
  .pallets-cerrados { margin-top: 8px; font-size: 13px; color: var(--suave); }
  .franja-sobra { background: var(--rojo); color: #fff; padding: 10px 12px; margin-bottom: 10px; font-weight: 600; }
  .alerta-total { position: fixed; inset: 0; z-index: 60; background: rgba(215,20,26,.96); color: #fff; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; }
  .alerta-total.on { display: flex; }
  .alerta-total .t { font-family: var(--cond); font-size: 40px; line-height: 1; margin-bottom: 12px; }
  .alerta-total .d { font-size: 18px; max-width: 520px; margin-bottom: 24px; }
  .alerta-total button { background: #fff; color: var(--rojo); border: 0; padding: 16px 36px; font-weight: 700; font-size: 18px; }
  .revisor { font-size: 13px; color: var(--suave); margin: -4px 0 10px; }
  main { padding: 12px 12px 110px; max-width: 720px; margin: 0 auto; }
  .vacio { text-align: center; color: var(--suave); padding: 48px 16px; }
  .vacio strong { display: block; color: var(--tinta); font-family: var(--cond); font-size: 26px; margin-bottom: 6px; }

  .doc { display: flex; justify-content: space-between; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
  .doc h1 { font-family: var(--cond); font-size: 28px; margin: 0; line-height: 1; }
  .doc p { margin: 4px 0 0; color: var(--suave); font-size: 14px; }
  .doc .total { font-family: var(--cond); font-size: 34px; line-height: 1; text-align: right; }
  .doc .total small { display: block; font-family: var(--texto); font-size: 12px; color: var(--suave); }
  .progreso { height: 8px; background: var(--linea); margin-bottom: 12px; }
  .progreso div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }

  .escaner { background: var(--papel); border: 2px solid var(--tinta); padding: 10px; margin-bottom: 10px; }
  .escaner .fila { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .escaner input { border: 1px solid var(--linea); padding: 12px; font-size: 18px; min-width: 0; }
  .escaner button { border: 1px solid var(--tinta); background: var(--papel); padding: 0 12px; font-weight: 600; }
  .escaner button.camara { background: var(--tinta); color: #fff; }
  #lector { margin-bottom: 6px; display: none; }
  #lector.leyendo .guia { border-color: var(--rojo); border-width: 4px; }
  #lector { position: relative; }
  #lector video { width: 100% !important; height: 26vh; min-height: 140px; max-height: 230px; object-fit: cover; display: block; border-radius: 4px; background: #000; }
  #lector .guia { position: absolute; left: 50%; top: 50%; width: 72%; height: 80%; transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,.85); transition: border-color .15s; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.25); pointer-events: none; }
  #lector.on { display: block; }

  .aviso { padding: 14px; margin-bottom: 12px; border-left: 8px solid var(--linea); background: var(--papel); min-height: 76px; }
  .aviso .t { font-family: var(--cond); font-size: 24px; line-height: 1.05; }
  .aviso .d { font-size: 14px; color: var(--suave); margin-top: 4px; }
  .aviso.ok { border-color: var(--ok); background: var(--ok-claro); }
  .aviso.parcial { border-color: var(--parcial); background: var(--parcial-claro); }
  .aviso.error { border-color: var(--rojo); background: var(--error-claro); }
  .aviso.flash { animation: flash .35s; }
  @keyframes flash { from { transform: scale(1.02); } to { transform: none; } }

  .filtro { width: 100%; border: 1px solid var(--linea); padding: 10px 12px; margin-bottom: 8px; background: var(--papel); }

  .lista { background: var(--papel); border: 1px solid var(--linea); }
  .item { display: grid; grid-template-columns: 6px 1fr auto; border-bottom: 1px solid var(--linea); }
  .item:last-child { border-bottom: 0; }
  .item .estado { background: var(--linea); }
  .item.parcial .estado { background: var(--parcial); }
  .item.ok .estado { background: var(--ok); }
  .item.sobra .estado { background: var(--rojo); }
  .item.ok { background: #fbfefc; }
  .item.marcado { animation: marcado 1s; }
  @keyframes marcado { from { background: #fff1a8; } to { background: inherit; } }
  .info { padding: 10px 10px 10px 12px; min-width: 0; }
  .info .n { font-weight: 600; line-height: 1.25; }
  .info .v { font-size: 14px; color: var(--suave); }
  .info .c { font-size: 13px; color: var(--suave); margin-top: 3px; word-break: break-all; }
  .info .inc { font-size: 13px; color: var(--rojo); margin-top: 4px; font-weight: 600; }
  .info .sin { color: var(--rojo); }
  .lado { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 8px 10px; gap: 6px; }
  .cuenta { font-family: var(--cond); font-size: 28px; line-height: 1; white-space: nowrap; }
  .cuenta small { font-size: 18px; color: var(--suave); }
  .acciones { display: flex; gap: 4px; }
  .acciones button { width: 38px; height: 34px; border: 1px solid var(--linea); background: var(--papel); font-weight: 600; font-size: 18px; }
  .acciones button.i { font-size: 13px; width: auto; padding: 0 8px; }

  h2 { font-family: var(--cond); font-size: 22px; margin: 18px 0 6px; }
  .extras .item .estado { background: var(--rojo); }
  .ocultas { font-size: 13px; color: var(--suave); margin-top: 14px; }

  .pie { position: fixed; left: 0; right: 0; bottom: 0; background: var(--papel); border-top: 1px solid var(--linea); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: auto 1fr; gap: 8px; z-index: 20; }
  .pie button { padding: 14px; font-weight: 600; border: 1px solid var(--tinta); background: var(--papel); }
  .pie .cerrar { background: var(--tinta); color: #fff; font-size: 17px; }
  .pie[hidden] { display: none; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal.on { display: flex; }
  .hoja { background: var(--papel); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .hoja h3 { font-family: var(--cond); font-size: 28px; margin: 0 0 8px; }
  .hoja ul { padding-left: 18px; margin: 6px 0 12px; }
  .hoja li { margin-bottom: 6px; }
  .hoja .grupo { font-weight: 600; margin-top: 10px; }
  .hoja .botones { display: grid; gap: 8px; margin-top: 14px; }
  .hoja .botones button { padding: 14px; font-weight: 600; border: 1px solid var(--tinta); background: var(--papel); }
  .hoja .botones .fuerte { background: var(--tinta); color: #fff; }
  .hoja .botones .peligro { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .final-ok { border-left: 8px solid var(--ok); padding-left: 12px; }
  .final-dif { border-left: 8px solid var(--rojo); padding-left: 12px; }

  .cargando { opacity: .5; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="barra">
  <div class="marca"><span>OXS</span> Revisión de pedidos</div>
  <div class="modos" role="tablist" aria-label="Tipo de revisión">
    <button type="button" data-modo="documento" class="activo" role="tab">Pedidos clientes</button>
    <button type="button" data-modo="bodega" role="tab">Bodega</button>
  </div>
  <form class="buscar" id="formBuscar" autocomplete="off">
    <div class="tipo" role="group" aria-label="Tipo de documento">
      <button type="button" data-tipo="FACTURA" class="activo">Factura</button>
      <button type="button" data-tipo="BOLETA">Boleta</button>
      <button type="button" data-tipo="NOTA VENTA">N. venta</button>
    </div>
    <input id="folio" inputmode="numeric" pattern="[0-9]*" placeholder="Folio" aria-label="Folio">
    <button class="ir" type="submit">Cargar</button>
  </form>
  <div class="buscar-bodega" id="barraBodega" hidden>
    <button class="ir" type="button" id="verPedidos">Ver pedidos de bodega</button>
  </div>
</header>

<main id="app">
  <div class="vacio">
    <strong>Ingresa el folio para empezar</strong>
    Elige factura o boleta, escribe el folio y toca Cargar. La app trae los productos desde Bsale ordenados de la A a la Z.
  </div>
</main>

<footer class="pie" id="pie" hidden>
  <button id="deshacer" type="button">Deshacer</button>
  <button id="cerrar" class="cerrar" type="button">Cerrar revisión</button>
</footer>

<input type="file" id="inputFoto" accept="image/*" capture="environment" hidden>
<input type="file" id="inputCodigo" accept="image/*" capture="environment" hidden>
<div id="lectorFoto" style="position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px"></div>
<div class="alerta-total" id="alertaTotal" role="alertdialog" aria-live="assertive"><div class="t" id="alertaT"></div><div class="d" id="alertaD"></div><button type="button" id="alertaOk">Revisado</button></div>
<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>

<script>
/* Conexión con el motor en Apps Script (reemplaza google.script.run fuera de Google). */
const API_URL = 'https://script.google.com/macros/s/AKfycbz8oTck0WREm__Wmt3DzevWG02MBYhzA0TbCnNqu16HNt9r6py2lYuGgYbliQPm2MNr/exec';
function claveApp() { try { return localStorage.getItem('claveAppOXS') || ''; } catch (e) { return ''; } }
function llamarApi(fn, args, claveForzada) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ clave: claveForzada != null ? claveForzada : claveApp(), fn: fn, args: args || [] })
  }).then(r => { if (!r.ok) throw new Error('El servidor respondió ' + r.status); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error || 'Error desconocido'); return j.data; });
}
window.google = { script: { get run() {
  let ok = () => {}, ko = () => {};
  const p = new Proxy({}, { get(_, k) {
    if (k === 'withSuccessHandler') return f => { ok = f; return p; };
    if (k === 'withFailureHandler') return f => { ko = f; return p; };
    return (...args) => { llamarApi(k, args).then(d => ok(d)).catch(e => {
      if (/Clave de acceso/.test(e.message)) { try { localStorage.removeItem('claveAppOXS'); } catch (_) {} }
      ko(e);
    }); };
  } });
  return p;
} } };
</script>
<script>
let modo = 'documento';
let tipo = 'FACTURA';
let doc = null;      // { modo, id, titulo, subtitulo, items:[{key,...}], ocultas }
let estado = null;   // { cuentas:{}, extras:{}, incid:{}, historial:[] }
let filtro = '';
let lector = null;
let ultimoCodigo = '', ultimoTiempo = 0;

const $ = (s) => document.querySelector(s);
const app = $('#app');
const INICIO = {
  documento: '<div class="vacio"><strong>Ingresa el folio para empezar</strong>Elige factura o boleta, escribe el folio y toca Cargar. La app trae los productos desde Bsale ordenados de la A a la Z.</div>',
  bodega: '<div class="vacio"><strong>Revisión en bodega</strong>Toca Ver pedidos de bodega y elige el pedido de la hoja EN CURSO BODEGA que vas a revisar.</div>'
};

document.querySelectorAll('.modos button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.modo === modo) return;
  modo = b.dataset.modo;
  document.querySelectorAll('.modos button').forEach(x => x.classList.toggle('activo', x === b));
  $('#formBuscar').hidden = modo !== 'documento';
  $('#barraBodega').hidden = modo !== 'bodega';
  reiniciar();
}));

document.querySelectorAll('.tipo button').forEach(b => b.addEventListener('click', () => {
  tipo = b.dataset.tipo;
  document.querySelectorAll('.tipo button').forEach(x => x.classList.toggle('activo', x === b));
}));

$('#formBuscar').addEventListener('submit', (e) => {
  e.preventDefault();
  const folio = $('#folio').value.trim();
  if (!folio) return;
  cargando('Buscando ' + tipo.toLowerCase() + ' ' + folio, 'Consultando Bsale…');
  google.script.run.withSuccessHandler(abrir).withFailureHandler(fallo).buscarDocumento(folio, tipo);
});

$('#verPedidos').addEventListener('click', () => {
  cargando('Leyendo pedidos', 'Consultando la hoja EN CURSO BODEGA…');
  google.script.run.withSuccessHandler((lista) => {
    if (!lista.length) { app.innerHTML = '<div class="vacio"><strong>No hay pedidos en la hoja</strong>Revisa que EN CURSO BODEGA tenga una fila de encabezados con SKU y Cantidad.</div>'; return; }
    app.innerHTML = '<h2>Elige el pedido</h2><div class="pedidos">' + lista.map(p => `
      <button class="pedido" data-id="${esc(p.id)}">
        <div class="n">${esc(p.titulo)}</div>
        <div class="v">${p.productos} productos, ${p.unidades} unidades</div>
      </button>`).join('') + '</div>';
    app.querySelectorAll('.pedido').forEach(b => b.addEventListener('click', () => {
      cargando('Cargando pedido', 'Buscando códigos de barra en Bsale…');
      google.script.run.withSuccessHandler(abrir).withFailureHandler(fallo).cargarPedidoBodega(b.dataset.id);
    }));
  }).withFailureHandler(fallo).listarPedidosBodega();
});

function cargando(t, d) {
  document.body.classList.remove('revisando');
  detenerCamara();
  $('#pie').hidden = true;
  app.innerHTML = '<div class="vacio"><strong>' + esc(t) + '</strong>' + esc(d) + '</div>';
}
function fallo(err) {
  if (/Clave de acceso/.test(err && err.message || '')) return pantallaClave(err.message);
  app.innerHTML = '<div class="vacio"><strong>No se pudo cargar</strong>' + esc(err.message || String(err)) + '</div>';
}
function reiniciar() {
  document.body.classList.remove('revisando');
  detenerCamara();
  doc = null; estado = null; filtro = '';
  $('#pie').hidden = true;
  app.innerHTML = INICIO[modo];
}

function clave() { return 'revision_' + doc.id; }
function guardar() { try { localStorage.setItem(clave(), JSON.stringify(estado)); } catch (e) {} }
function leerGuardado() { try { return JSON.parse(localStorage.getItem(clave()) || 'null'); } catch (e) { return null; } }
function borrarGuardado() { try { localStorage.removeItem(clave()); } catch (e) {} }

function abrir(r) {
  doc = r;
  const previo = leerGuardado();
  estado = previo || { cuentas: {}, extras: {}, incid: {}, historial: [] };
  const nueva = !previo;
  if (doc.modo === 'bodega' && (!estado.pallets || !estado.pallets[0].bultos)) {
    estado = { cuentas: {}, extras: estado.extras || {}, incid: estado.incid || {}, historial: [], pallets: [{ n: 1, bultos: [], foto: null }] };
  }
  filtro = '';
  if (!estado.inicio) estado.inicio = Date.now();
  if (!estado.revisor) estado.revisor = nombreRevisor();
  if (!estado.idRevision) estado.idRevision = doc.id + '_' + estado.inicio;
  guardar();
  armar();
  pintar();
  $('#pie').hidden = false;
  if (nueva) registrar('En revisión');
  if (previo && previo.historial.length) aviso('parcial', 'Revisión retomada', 'Se recuperó el avance que había en este celular.');
  const sinBsale = doc.items.filter(it => it.noEnBsale).length;
  if (sinBsale) aviso('parcial', sinBsale + ' SKU no están en Bsale', 'Se pueden revisar escaneando o escribiendo el SKU, pero no entrarán en la guía.');
  enfocar();
  if (videoDisponible() && !lector) iniciarCamara();
}

function totales() {
  let pedidas = 0, revisadas = 0;
  doc.items.forEach(it => { pedidas += it.cantidad; revisadas += Math.min(estado.cuentas[it.key] || 0, it.cantidad); });
  return { pedidas, revisadas };
}

function clase(it) {
  const n = estado.cuentas[it.key] || 0;
  if (n > it.cantidad) return 'sobra';
  if (n === it.cantidad) return 'ok';
  if (n > 0) return 'parcial';
  return '';
}

function armar() {
  app.innerHTML = `
    <div class="zona-fija">
      <div id="cabecera"></div>
      <section class="escaner">
        <div id="lector"></div>
        <button type="button" class="leer" id="btnLeer">LEER CÓDIGO</button>
        <div class="fila">
          <input id="codigo" inputmode="none" autocomplete="off" placeholder="Escanea o escribe el código" aria-label="Código de barras">
          <button type="button" id="teclado">Teclado</button>
          <button type="button" id="btnCamara" class="camara">${videoDisponible() ? 'Cámara' : 'Foto código'}</button>
        </div>
      </section>
      <div class="aviso" id="aviso"><div class="t">Listo para leer</div><div class="d">Pon la etiqueta dentro del recuadro y toca LEER CÓDIGO. También puedes usar la pistola o escribir el código.</div></div>
    </div>
    <div id="desplazable">
      ${doc.modo === 'bodega' ? '<section class="pallets" id="pallets"></section>' : ''}
      <input class="filtro" id="filtro" placeholder="Buscar por nombre o SKU">
      <div id="cuerpo"></div>
    </div>`;
  document.body.classList.add('revisando');
  $('#btnLeer').addEventListener('click', activarLectura);
  $('.zona-fija').addEventListener('click', (e) => {
    if (e.target.closest('#btnSalir') && confirm('¿Salir de esta revisión? El avance queda guardado en este celular.')) reiniciar();
  });
  const inp = $('#codigo');
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); procesar(inp.value); inp.value = ''; }
  });
  $('#teclado').addEventListener('click', () => {
    inp.setAttribute('inputmode', inp.getAttribute('inputmode') === 'none' ? 'text' : 'none');
    inp.blur(); inp.focus();
  });
  $('#btnCamara').addEventListener('click', alternarCamara);
  if (doc.modo === 'bodega') {
    $('#pallets').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.id === 'btnFoto') { detenerCamara(); $('#inputFoto').value = ''; $('#inputFoto').click(); }
      if (b.id === 'btnOtroPallet') nuevoPallet();
      if (b.id === 'btnCorregir') corregirConteo();
      if (b.dataset.bmas) editarBulto(Number(b.dataset.bmas), 1);
      if (b.dataset.bmenos) editarBulto(Number(b.dataset.bmenos), -1);
      if (b.dataset.bquitar) quitarBultoIndice(Number(b.dataset.bquitar));
    });
  }
  $('#filtro').addEventListener('input', (e) => { filtro = e.target.value; pintar(); });
  $('#cuerpo').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mas) doc.modo === 'bodega' ? agregarBulto(b.dataset.mas, 'manual') : sumar(b.dataset.mas, 1, 'manual');
    else if (b.dataset.menos) doc.modo === 'bodega' ? quitarBulto(b.dataset.menos) : sumar(b.dataset.menos, -1, 'manual');
    else if (b.dataset.inc) incidencia(b.dataset.inc);
    else if (b.dataset.extra) {
      const c = b.dataset.extra;
      estado.extras[c] = Math.max(0, (estado.extras[c] || 0) - 1);
      estado.historial.push({ t: 'extra', c, d: -1 });
      guardar(); pintar(); enfocar();
    }
  });
}

function pintar() {
  const t = totales();
  const pct = t.pedidas ? Math.round(t.revisadas / t.pedidas * 100) : 0;
  const f = filtro.toLowerCase();
  const visibles = doc.items.filter(it => !f || (it.nombre + ' ' + it.variante + ' ' + it.sku + ' ' + it.barcode).toLowerCase().includes(f));
  const extras = Object.keys(estado.extras).filter(c => estado.extras[c] > 0);

  $('#cabecera').innerHTML = `
    <section class="doc">
      <div>
        <h1>${esc(doc.titulo)}</h1>
        <p>${esc(doc.subtitulo || '').replace(/\n/g, '<br>')}</p>
        <button type="button" class="salir" id="btnSalir">Salir</button>
      </div>
      <div class="total">${t.revisadas}/${t.pedidas}<small>unidades</small></div>
    </section>
    <div class="progreso"><div style="width:${pct}%"></div></div>
    <div class="revisor">Revisor: ${esc(estado.revisor || '')}. Inicio: ${fechaHora(estado.inicio)}</div>
    ${unidadesDeMas() ? `<div class="franja-sobra">Hay ${unidadesDeMas()} unidad(es) de más. Revísalas manualmente y retíralas.</div>` : ''}`;
  if (doc.modo === 'bodega') pintarPallets();

  $('#cuerpo').innerHTML = `
    <div class="lista">
      ${visibles.map(filaItem).join('') || '<div class="vacio">Sin resultados para esa búsqueda.</div>'}
    </div>
    ${extras.length ? `
      <h2>Escaneado y no está en el ${doc.modo === 'bodega' ? 'pedido' : 'documento'}</h2>
      <div class="lista extras">
        ${extras.map(c => `
          <div class="item sobra">
            <div class="estado"></div>
            <div class="info"><div class="n">Código ${esc(c)}</div><div class="v">No pertenece a este ${doc.modo === 'bodega' ? 'pedido' : 'documento'}. Retíralo.</div></div>
            <div class="lado"><div class="cuenta">${estado.extras[c]}</div>
              <div class="acciones"><button data-extra="${esc(c)}" aria-label="Quitar uno">−</button></div></div>
          </div>`).join('')}
      </div>` : ''}
    ${doc.ocultas && doc.ocultas.length ? `<p class="ocultas">No se revisan (despacho o servicios): ${doc.ocultas.map(esc).join(', ')}</p>` : ''}`;
}

function filaItem(it) {
  const n = estado.cuentas[it.key] || 0;
  const inc = estado.incid[it.key];
  const codigo = it.noEnBsale ? '<span class="sin">SKU no encontrado en Bsale</span>'
    : it.barcode ? 'Código ' + esc(it.barcode) : '<span class="sin">Sin código de barras en Bsale</span>';
  return `
    <div class="item ${clase(it)}" id="it-${esc(it.key)}">
      <div class="estado"></div>
      <div class="info">
        <div class="n">${esc(it.nombre)}</div>
        ${it.variante && it.variante !== it.nombre ? `<div class="v">${esc(it.variante)}</div>` : ''}
        <div class="c">SKU ${esc(it.sku || '—')} · ${codigo}</div>
        ${doc.modo === 'bodega' ? `<div class="c">Caja de ${it.embalaje} u. Pedido: ${Math.ceil(it.cantidad / it.embalaje)} caja(s)</div>` : ''}
        ${inc ? `<div class="inc">Incidencia: ${esc(inc)}</div>` : ''}
      </div>
      <div class="lado">
        <div class="cuenta">${n}<small>/${it.cantidad}</small></div>
        <div class="acciones">
          <button data-menos="${esc(it.key)}" aria-label="Restar una unidad">−</button>
          <button data-mas="${esc(it.key)}" aria-label="Sumar una unidad">+</button>
          <button class="i" data-inc="${esc(it.key)}">Incid.</button>
        </div>
      </div>
    </div>`;
}

function enfocar() {
  const inp = $('#codigo');
  if (inp && document.activeElement !== $('#filtro')) inp.focus({ preventScroll: true });
}

function procesar(codigo) {
  codigo = String(codigo || '').trim();
  if (!codigo || !doc) return;
  const C = codigo.toUpperCase();
  const coincidencias = doc.items.filter(it =>
    (it.barcode && String(it.barcode).trim().toUpperCase() === C) ||
    (it.sku && String(it.sku).trim().toUpperCase() === C));
  if (!coincidencias.length) {
    estado.extras[codigo] = (estado.extras[codigo] || 0) + 1;
    estado.historial.push({ t: 'extra', c: codigo, d: 1 });
    guardar(); pintar();
    aviso('error', 'No está en el ' + (doc.modo === 'bodega' ? 'pedido' : 'documento'), 'Código ' + codigo + '. Retira este producto.');
    sonar(false); enfocar();
    alertaTotal('Producto de más', 'El código ' + codigo + ' no está en ' + doc.titulo + '. Revisa manualmente y retíralo.');
    return;
  }
  const it = coincidencias.find(x => (estado.cuentas[x.key] || 0) < x.cantidad) || coincidencias[0];
  if (doc.modo === 'bodega') agregarBulto(it.key, 'scan'); else sumar(it.key, 1, 'scan');
}

function nombreCompleto(it) { return it.nombre + (it.variante && it.variante !== it.nombre ? ' / ' + it.variante : ''); }

function sumar(key, d, origen) {
  const it = doc.items.find(x => x.key === key);
  if (!it) return;
  const antes = estado.cuentas[key] || 0;
  const n = Math.max(0, antes + d);
  if (n === antes) { enfocar(); return; }
  estado.cuentas[key] = n;
  estado.historial.push({ t: 'item', key, d: n - antes });
  guardar(); pintar();
  if (n > it.cantidad) { aviso('error', 'Sobra: ' + n + ' de ' + it.cantidad, nombreCompleto(it) + '. Retira ' + (n - it.cantidad) + ' unidad(es).'); sonar(false); if (d > 0) alertaTotal('Unidades de más', nombreCompleto(it) + ': hay ' + n + ' y el documento pide ' + it.cantidad + '. Revisa manualmente y retira ' + (n - it.cantidad) + '.'); }
  else if (n === it.cantidad) { aviso('ok', 'Completo: ' + n + ' de ' + it.cantidad, nombreCompleto(it)); sonar(true); }
  else { aviso('parcial', n + ' de ' + it.cantidad + (d < 0 ? ' (se restó una)' : ''), nombreCompleto(it) + '. Faltan ' + (it.cantidad - n) + '.'); if (d > 0) sonar(true); }
  const fila = document.getElementById('it-' + key);
  if (fila && origen === 'scan') fila.classList.add('marcado');
  enfocar();
}

function incidencia(key) {
  const it = doc.items.find(x => x.key === key);
  const txt = prompt('Incidencia para ' + it.nombre + '\n(ej: código no lee, etiqueta dañada, producto distinto). Deja vacío para quitarla.', estado.incid[key] || '');
  if (txt === null) return enfocar();
  if (txt.trim()) estado.incid[key] = txt.trim(); else delete estado.incid[key];
  guardar(); pintar(); enfocar();
}

$('#deshacer').addEventListener('click', () => {
  if (!estado || !estado.historial.length) return;
  const h = estado.historial.pop();
  if (h.t === 'item') {
    estado.cuentas[h.key] = Math.max(0, (estado.cuentas[h.key] || 0) - h.d);
  } else if (h.t === 'bulto') {
    const p = estado.pallets[h.p];
    if (p) {
      if (h.op === 'add') { const i = p.bultos.lastIndexOf(h.ref); if (i >= 0) p.bultos.splice(i, 1); else p.bultos.pop(); }
      if (h.op === 'del') p.bultos.splice(Math.min(h.i, p.bultos.length), 0, h.ref);
      if (h.op === 'edit' && p.bultos[h.i]) p.bultos[h.i].u = Math.max(1, p.bultos[h.i].u - h.d);
    }
    recalcular();
  }
  else if (h.t === 'extra') estado.extras[h.c] = Math.max(0, (estado.extras[h.c] || 0) - h.d);
  guardar(); pintar();
  aviso('parcial', 'Se deshizo el último movimiento', '');
  enfocar();
});

function diferencias() {
  const faltan = [], sobran = [], incid = [];
  doc.items.forEach(it => {
    const n = estado.cuentas[it.key] || 0;
    const nom = nombreCompleto(it) + ' (SKU ' + (it.sku || '—') + ')';
    if (n < it.cantidad) faltan.push(nom + ': faltan ' + (it.cantidad - n));
    if (n > it.cantidad) sobran.push(nom + ': sobran ' + (n - it.cantidad));
    if (estado.incid[it.key]) incid.push(nom + ': ' + estado.incid[it.key]);
  });
  const sinFoto = [];
  if (doc.modo === 'bodega') estado.pallets.forEach(p => {
    if (!p.bultos.length) return;
    if (!p.foto) sinFoto.push('Pallet ' + p.n + ' (' + p.bultos.length + ' bultos) no tiene foto');
    else if (p.cajasFoto != null && p.cajasFoto !== p.bultos.length) sinFoto.push('Pallet ' + p.n + ': ' + p.bultos.length + ' bultos escaneados y ' + p.cajasFoto + ' cajas en la foto');
  });
  const fuera = Object.keys(estado.extras).filter(c => estado.extras[c] > 0).map(c => 'Código ' + c + ': ' + estado.extras[c] + ' unidad(es)');
  return { faltan, sobran, fuera, incid, sinFoto, hay: faltan.length + sobran.length + fuera.length + incid.length + sinFoto.length > 0 };
}

function textoResumen(d) {
  const t = totales();
  return [
    doc.titulo,
    'Revisor: ' + (estado.revisor || '') + '. Inicio: ' + fechaHora(estado.inicio) + '. Término: ' + fechaHora(estado.termino || Date.now()),
    d.hay ? 'Revisión cerrada CON diferencias' : 'Revisión OK: todo cuadra',
    'Unidades revisadas: ' + t.revisadas + ' de ' + t.pedidas
  ].concat(d.faltan.map(x => 'Falta - ' + x), d.sobran.map(x => 'Sobra - ' + x),
           d.fuera.map(x => 'Fuera del pedido - ' + x), d.incid.map(x => 'Incidencia - ' + x),
           (d.sinFoto || []).map(x => 'Pallet - ' + x)).join('\n');
}

$('#cerrar').addEventListener('click', () => {
  if (!doc) return;
  const d = diferencias();
  if (!d.hay) return finalizar(d);
  const bloque = (titulo, arr) => arr.length ? `<div class="grupo">${titulo}</div><ul>${arr.map(x => '<li>' + esc(x) + '</li>').join('')}</ul>` : '';
  abrirModal(`
    <h3>Hay diferencias</h3>
    <p>Revisa esto antes de cerrar ${esc(doc.titulo)}.</p>
    ${bloque('Faltan', d.faltan)}
    ${bloque('Sobran', d.sobran)}
    ${bloque('No están en el ' + (doc.modo === 'bodega' ? 'pedido' : 'documento'), d.fuera)}
    ${bloque('Incidencias', d.incid)}
    ${bloque('Pallets', d.sinFoto)}
    <div class="botones">
      <button class="fuerte" id="seguir">Seguir revisando</button>
      <button class="peligro" id="forzar">Cerrar con diferencias</button>
    </div>`);
  $('#seguir').onclick = () => { cerrarModal(); enfocar(); };
  $('#forzar').onclick = () => finalizar(d);
});

function finalizar(d) {
  detenerCamara();
  estado.termino = Date.now();
  guardar();
  registrar(d.hay ? 'Con diferencias' : 'OK', d);
  const t = totales();
  const resumen = textoResumen(d);
  const esBodega = doc.modo === 'bodega';

  abrirModal(`
    <div class="${d.hay ? 'final-dif' : 'final-ok'}">
      <h3>${d.hay ? 'Cerrada con diferencias' : 'Todo cuadra'}</h3>
      <p>${esc(doc.titulo)}. ${t.revisadas} de ${t.pedidas} unidades revisadas.</p>
      <p>Revisor: ${esc(estado.revisor || '')}<br>Inicio: ${fechaHora(estado.inicio)}<br>Término: ${fechaHora(estado.termino)}</p>
      <p id="estadoRegistro">Guardando en el registro…</p>
      ${esBodega ? '<p>La guía de despacho se emite con las unidades revisadas y se envía por correo.</p>' : ''}
    </div>
    <div class="resultado" id="resultado"></div>
    <div class="botones">
      ${esBodega ? '<button class="peligro" id="emitir">Emitir guía y enviar correo</button>' : ''}
      <button id="copiar">Copiar resumen</button>
      <button class="fuerte" id="nueva">Nueva revisión</button>
    </div>`);

  $('#copiar').onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(resumen) : Promise.reject())
      .then(() => { $('#copiar').textContent = 'Resumen copiado'; })
      .catch(() => { prompt('Copia el resumen:', resumen); });
  };
  $('#nueva').onclick = () => { borrarGuardado(); cerrarModal(); reiniciar(); window.scrollTo(0, 0); };

  if (esBodega) {
    $('#emitir').onclick = () => {
      const b = $('#emitir');
      b.disabled = true; b.textContent = 'Emitiendo…';
      const conteos = doc.items.map(it => ({
        sku: it.sku, variantId: it.variantId, nombre: it.nombre, variante: it.variante,
        pedida: it.cantidad, revisada: estado.cuentas[it.key] || 0
      }));
      google.script.run
        .withSuccessHandler((r) => {
          b.textContent = r.modo === 'PRUEBA' ? 'Prueba registrada' : 'Guía emitida';
          $('#resultado').innerHTML = esc(r.mensaje) + (r.urlPdf ? '<br><a href="' + esc(r.urlPdf) + '" target="_blank" rel="noopener">Ver PDF de la guía</a>' : '');
          borrarGuardado();
        })
        .withFailureHandler((err) => {
          b.disabled = false; b.textContent = 'Reintentar emisión';
          $('#resultado').innerHTML = '<span class="sin">' + esc(err.message || String(err)) + '</span>';
        })
        .cerrarRevisionBodega(doc.titulo, conteos, resumen, palletsParaEnviar());
    };
  }
}

function unidadesPallet(p) { return p.bultos.reduce((s, b) => s + b.u, 0); }
function palletActual() { return estado.pallets[estado.pallets.length - 1]; }
function itemPorKey(k) { return doc.items.find(x => x.key === k); }

function recalcular() {
  const c = {};
  estado.pallets.forEach(p => p.bultos.forEach(b => { c[b.key] = (c[b.key] || 0) + b.u; }));
  estado.cuentas = c;
}

function agregarBulto(key, origen) {
  const it = itemPorKey(key); if (!it) return;
  const p = palletActual();
  const bulto = { key, u: it.embalaje || 1 };
  p.bultos.push(bulto);
  estado.historial.push({ t: 'bulto', op: 'add', p: estado.pallets.length - 1, ref: bulto });
  recalcular(); guardar(); pintar();
  const n = estado.cuentas[key];
  const det = nombreCompleto(it) + '. Bulto ' + p.bultos.length + ' del pallet ' + p.n + ', ' + bulto.u + ' u.';
  if (n > it.cantidad) { aviso('error', 'Sobra: ' + n + ' de ' + it.cantidad + ' u.', det + ' Retira ' + (n - it.cantidad) + ' unidad(es).'); sonar(false); alertaTotal('Unidades de más', nombreCompleto(it) + ': hay ' + n + ' y el pedido pide ' + it.cantidad + '. Revisa manualmente y retira ' + (n - it.cantidad) + '.'); }
  else if (n === it.cantidad) { aviso('ok', 'Completo: ' + n + ' de ' + it.cantidad + ' u.', det); sonar(true); }
  else { aviso('parcial', n + ' de ' + it.cantidad + ' u.', det + ' Faltan ' + (it.cantidad - n) + '.'); sonar(true); }
  const fila = document.getElementById('it-' + key);
  if (fila && origen === 'scan') fila.classList.add('marcado');
  enfocar();
}

function quitarBulto(key) {
  for (let pi = estado.pallets.length - 1; pi >= 0; pi--) {
    const p = estado.pallets[pi];
    for (let i = p.bultos.length - 1; i >= 0; i--) {
      if (p.bultos[i].key !== key) continue;
      const ref = p.bultos.splice(i, 1)[0];
      estado.historial.push({ t: 'bulto', op: 'del', p: pi, i, ref });
      recalcular(); guardar(); pintar();
      aviso('parcial', 'Bulto quitado del pallet ' + p.n, nombreCompleto(itemPorKey(key)));
      return enfocar();
    }
  }
  enfocar();
}

function editarBulto(i, d) {
  const p = palletActual(); const b = p.bultos[i]; if (!b) return;
  const nuevo = Math.max(1, b.u + d);
  if (nuevo === b.u) return;
  estado.historial.push({ t: 'bulto', op: 'edit', p: estado.pallets.length - 1, i, d: nuevo - b.u });
  b.u = nuevo;
  recalcular(); guardar(); pintar();
  aviso('parcial', 'Bulto ' + (i + 1) + ': ' + nuevo + ' u.', nombreCompleto(itemPorKey(b.key)));
}

function quitarBultoIndice(i) {
  const p = palletActual(); const ref = p.bultos[i]; if (!ref) return;
  p.bultos.splice(i, 1);
  estado.historial.push({ t: 'bulto', op: 'del', p: estado.pallets.length - 1, i, ref });
  recalcular(); guardar(); pintar();
}

function corregirConteo() {
  const p = palletActual();
  const v = prompt('¿Cuántas cajas tiene el pallet ' + p.n + '?', p.cajasFoto != null ? p.cajasFoto : p.bultos.length);
  if (v === null) return enfocar();
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 0) return enfocar();
  p.cajasFoto = n; p.cajasFotoManual = true;
  guardar(); pintarPallets(); enfocar();
}

function pintarPallets() {
  const z = $('#pallets'); if (!z) return;
  const p = palletActual();
  const nb = p.bultos.length;
  let conteo = '';
  if (p.foto && p.cajasFoto != null) {
    const ok = p.cajasFoto === nb;
    conteo = `<div class="conteo ${ok ? 'ok' : 'error'}">
      ${p.cajasFotoManual ? 'Conteo manual' : 'La IA contó'}: ${p.cajasFoto} cajas. Escaneados: ${nb} bultos.
      ${ok ? 'Cuadra.' : 'No cuadra, revisa el pallet.'}
      ${p.notaIA && !p.cajasFotoManual ? '<br>' + esc(p.notaIA) : ''}
      <button type="button" id="btnCorregir">Corregir</button></div>`;
  } else if (p.foto) {
    conteo = `<div class="conteo">Sin conteo de la IA para esta foto. <button type="button" id="btnCorregir">Ingresar cajas</button></div>`;
  }
  const anteriores = estado.pallets.slice(0, -1);
  z.innerHTML = `
    <div class="pallet-actual">
      <div class="miniatura">${p.foto && p.foto.mini ? '<img src="' + p.foto.mini + '" alt="Foto del pallet ' + p.n + '">' : 'Sin foto'}</div>
      <div><div class="n">Pallet ${p.n}</div><div class="v">${nb} bultos, ${unidadesPallet(p)} unidades</div></div>
    </div>
    ${conteo}
    <div class="pallet-botones">
      <button type="button" id="btnFoto" class="foto${p.foto ? ' lista' : ''}">${p.foto ? 'Repetir foto' : 'Foto del pallet'}</button>
      <button type="button" id="btnOtroPallet">Cerrar pallet y abrir otro</button>
    </div>
    ${nb ? `<details class="bultos"><summary>Bultos del pallet ${p.n} (${nb})</summary>
      ${p.bultos.map((b, i) => { const it = itemPorKey(b.key); return `
        <div class="bulto">
          <div class="num">${i + 1}</div>
          <div>${esc(it ? nombreCompleto(it) : b.key)}</div>
          <div class="acciones">
            <button type="button" data-bmenos="${i}" aria-label="Restar unidad">−</button>
            <span class="u">${b.u}</span>
            <button type="button" data-bmas="${i}" aria-label="Sumar unidad">+</button>
            <button type="button" class="i" data-bquitar="${i}">Quitar</button>
          </div>
        </div>`; }).join('')}
    </details>` : ''}
    ${anteriores.length ? '<div class="pallets-cerrados">Cerrados: ' + anteriores.map(a => 'Pallet ' + a.n + ' (' + a.bultos.length + ' bultos' + (a.cajasFoto != null ? ', foto ' + a.cajasFoto : ', sin foto') + ')').join('; ') + '</div>' : ''}`;
}

function nuevoPallet() {
  const p = palletActual();
  if (!p.bultos.length) { aviso('parcial', 'Pallet ' + p.n + ' está vacío', 'Escanea sus cajas antes de cerrarlo.'); return enfocar(); }
  if (!p.foto) { aviso('error', 'Falta la foto del pallet ' + p.n, 'Toma la foto antes de cerrarlo.'); sonar(false); return enfocar(); }
  if (p.cajasFoto != null && p.cajasFoto !== p.bultos.length &&
      !confirm('En la foto hay ' + p.cajasFoto + ' cajas y se escanearon ' + p.bultos.length + ' bultos. ¿Cerrar el pallet igual?')) return enfocar();
  estado.pallets.push({ n: p.n + 1, bultos: [], foto: null });
  guardar(); pintarPallets();
  aviso('ok', 'Pallet ' + (p.n + 1) + ' abierto', 'Las cajas que escanees ahora quedan en este pallet.');
  enfocar();
}

$('#inputFoto').addEventListener('change', (e) => {
  const archivo = e.target.files && e.target.files[0];
  if (!archivo || !doc || doc.modo !== 'bodega') return;
  const p = estado.pallets[estado.pallets.length - 1];
  const b = $('#btnFoto'); if (b) { b.disabled = true; b.textContent = 'Subiendo y contando…'; }
  reducirImagen(archivo, 1600, 0.75).then(grande => reducirImagen(archivo, 160, 0.6).then(mini => {
    google.script.run
      .withSuccessHandler((r) => {
        p.foto = { id: r.id, url: r.url, mini };
        p.cajasFotoManual = false;
        p.cajasFoto = r.conteo ? r.conteo.cajas : null;
        p.notaIA = r.conteo ? [r.conteo.confianza ? 'Confianza ' + r.conteo.confianza : '', r.conteo.nota].filter(Boolean).join('. ') : '';
        guardar(); pintarPallets();
        if (!r.conteo) aviso('parcial', 'Foto guardada, sin conteo de la IA', r.errorIa || 'Ingresa las cajas a mano.');
        else if (r.conteo.cajas === p.bultos.length) { aviso('ok', 'Cuadra: ' + r.conteo.cajas + ' cajas', 'Pallet ' + p.n + ': la foto y los bultos escaneados coinciden.'); sonar(true); }
        else { aviso('error', 'No cuadra: ' + r.conteo.cajas + ' cajas en la foto', 'Se escanearon ' + p.bultos.length + ' bultos en el pallet ' + p.n + '.'); sonar(false); }
        enfocar();
        if (videoDisponible() && !lector) iniciarCamara();
      })
      .withFailureHandler((err) => {
        pintarPallets();
        aviso('error', 'No se pudo subir la foto', (err.message || String(err)) + '. Vuelve a intentarlo.');
        sonar(false);
      })
      .subirFotoPallet(doc.titulo, p.n, grande);
  })).catch(() => { pintarPallets(); aviso('error', 'No se pudo leer la foto', 'Vuelve a tomarla.'); });
});

function reducirImagen(archivo, max, calidad) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', calidad));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(); };
    img.src = url;
  });
}

function palletsParaEnviar() {
  return estado.pallets.filter(p => p.bultos.length).map(p => {
    const porKey = {};
    p.bultos.forEach(b => { porKey[b.key] = (porKey[b.key] || 0) + b.u; });
    return {
      n: p.n,
      fotoId: p.foto ? p.foto.id : null,
      bultos: p.bultos.length,
      cajasFoto: p.cajasFoto != null ? p.cajasFoto : null,
      cajasFotoManual: !!p.cajasFotoManual,
      items: doc.items.filter(it => porKey[it.key]).map(it => ({ nombre: it.nombre, variante: it.variante, sku: it.sku, cantidad: porKey[it.key] }))
    };
  });
}

function fechaHora(ms) {
  if (!ms) return '';
  const f = new Date(ms), p = n => String(n).padStart(2, '0');
  return p(f.getDate()) + '-' + p(f.getMonth() + 1) + '-' + f.getFullYear() + ' ' + p(f.getHours()) + ':' + p(f.getMinutes());
}

function nombreRevisor() {
  let n = '';
  try { n = localStorage.getItem('revisorOXS') || ''; } catch (e) {}
  while (!n) {
    n = (prompt('¿Quién hace la revisión? Escribe tu nombre:') || '').trim();
  }
  try { localStorage.setItem('revisorOXS', n); } catch (e) {}
  return n;
}

function unidadesDeMas() {
  if (!doc || !estado) return 0;
  let s = 0;
  doc.items.forEach(it => { s += Math.max(0, (estado.cuentas[it.key] || 0) - it.cantidad); });
  Object.keys(estado.extras).forEach(c => { s += estado.extras[c] || 0; });
  return s;
}

let lecturaPausada = false;
function alertaTotal(titulo, detalle) {
  lecturaPausada = true;
  $('#alertaT').textContent = titulo;
  $('#alertaD').textContent = detalle;
  $('#alertaTotal').classList.add('on');
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
}
$('#alertaOk').addEventListener('click', () => {
  $('#alertaTotal').classList.remove('on');
  setTimeout(() => { lecturaPausada = false; }, 800);
  enfocar();
});

function registrar(estadoTexto, d) {
  if (!doc || !estado) return;
  d = d || diferencias();
  const t = totales();
  const sobran = unidadesDeMas();
  const detalle = [].concat(
    d.faltan.map(x => 'Falta - ' + x), d.sobran.map(x => 'Sobra - ' + x),
    d.fuera.map(x => 'Fuera - ' + x), d.incid.map(x => 'Incidencia - ' + x),
    (d.sinFoto || []).map(x => 'Pallet - ' + x)).join('\n');
  const datos = {
    id: estado.idRevision, modo: doc.modo === 'bodega' ? 'Bodega' : 'Pedido cliente',
    documento: doc.titulo, cliente: (doc.subtitulo || '').split('\n')[0], revisor: estado.revisor,
    inicio: estado.inicio, termino: estadoTexto === 'En revisión' ? null : estado.termino,
    estado: estadoTexto, pedidas: t.pedidas, revisadas: t.revisadas,
    faltantes: doc.items.reduce((s, it) => s + Math.max(0, it.cantidad - (estado.cuentas[it.key] || 0)), 0),
    sobrantes: sobran, fuera: Object.keys(estado.extras).reduce((s, c) => s + (estado.extras[c] || 0), 0),
    incidencias: Object.keys(estado.incid).length, detalle: detalle
  };
  google.script.run
    .withSuccessHandler(() => { const e = $('#estadoRegistro'); if (e) e.textContent = 'Guardado en el registro de revisiones.'; })
    .withFailureHandler((err) => { const e = $('#estadoRegistro'); if (e) e.innerHTML = '<span class="sin">No se pudo guardar en el registro: ' + esc(err.message || String(err)) + '</span>'; })
    .registrarRevision(datos);
}

function abrirModal(html) { $('#hoja').innerHTML = html; $('#modal').classList.add('on'); }
function cerrarModal() { $('#modal').classList.remove('on'); }

function aviso(tipoAviso, titulo, detalle) {
  const a = $('#aviso'); if (!a) return;
  a.className = 'aviso ' + tipoAviso;
  a.innerHTML = '<div class="t">' + esc(titulo) + '</div>' + (detalle ? '<div class="d">' + esc(detalle) + '</div>' : '');
  void a.offsetWidth; a.classList.add('flash');
}

let audio = null;
function sonar(bien) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = bien ? 'sine' : 'square';
    o.frequency.value = bien ? 1100 : 220;
    g.gain.value = 0.15;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + (bien ? 0.09 : 0.35));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(bien ? 40 : [120, 60, 120]);
}

/** El video en vivo solo funciona si la página puede usar la cámara (no dentro del marco de Apps Script). */
function videoDisponible() {
  try { if (document.featurePolicy && document.featurePolicy.allowsFeature) return document.featurePolicy.allowsFeature('camera'); } catch (e) {}
  try { return window.self === window.top; } catch (e) { return false; }
}

function alternarCamara() {
  if (!videoDisponible()) { $('#inputCodigo').value = ''; $('#inputCodigo').click(); return; }
  lector ? detenerCamara() : iniciarCamara();
}

const FORMATOS_NATIVOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];

async function leerCodigoDeImagen(archivo) {
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({ formats: FORMATOS_NATIVOS });
      const r = await det.detect(await createImageBitmap(archivo));
      if (r.length) return r[0].rawValue;
    } catch (e) {}
  }
  if (!window.Html5Qrcode) throw new Error('lector no disponible');
  const F = Html5QrcodeSupportedFormats;
  const lectorFoto = new Html5Qrcode('lectorFoto', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF], verbose: false });
  try { return await lectorFoto.scanFile(archivo, false); }
  finally { try { lectorFoto.clear(); } catch (e) {} }
}

async function archivoReducido(archivo, max) {
  const url = await reducirImagen(archivo, max, 0.9);
  const blob = await (await fetch(url)).blob();
  return new File([blob], 'codigo.jpg', { type: 'image/jpeg' });
}

$('#inputCodigo').addEventListener('change', async (e) => {
  const archivo = e.target.files && e.target.files[0];
  if (!archivo || !doc) return;
  aviso('parcial', 'Leyendo código…', 'Un momento.');
  let codigo = null;
  for (const intento of [() => archivoReducido(archivo, 1600), () => archivoReducido(archivo, 2400), () => Promise.resolve(archivo)]) {
    try { codigo = await leerCodigoDeImagen(await intento()); } catch (err) { codigo = null; }
    if (codigo) break;
  }
  if (codigo) procesar(codigo);
  else { aviso('error', 'No se pudo leer el código', 'Saca la foto más cerca, con el código derecho, nítido y sin reflejo, y vuelve a intentar.'); sonar(false); enfocar(); }
});

let lectorStream = null, lectorTimer = null, zxReader = null;

/* La cámara solo lee cuando se toca LEER CÓDIGO: toma el primer código que vea en 3 segundos y se detiene. */
let leyendo = false, timerLectura = null;

function marcarLectura(activa) {
  leyendo = activa;
  const b = $('#btnLeer'); if (b) { b.classList.toggle('activo', activa); b.textContent = activa ? 'LEYENDO…' : 'LEER CÓDIGO'; }
  const z = $('#lector'); if (z) z.classList.toggle('leyendo', activa);
  if (!activa && timerLectura) { clearTimeout(timerLectura); timerLectura = null; }
}

async function activarLectura() {
  if (lecturaPausada || leyendo) return;
  if (!videoDisponible()) { $('#inputCodigo').value = ''; $('#inputCodigo').click(); return; }
  if (!lector) await iniciarCamara();
  if (!lector) return;
  marcarLectura(true);
  timerLectura = setTimeout(() => {
    marcarLectura(false);
    aviso('parcial', 'No se detectó un código', 'Acerca la etiqueta al recuadro, evita reflejos y vuelve a tocar LEER CÓDIGO.');
  }, 3000);
}

function onCodigoCamara(texto) {
  if (!leyendo || lecturaPausada || $('#modal').classList.contains('on')) return;
  marcarLectura(false);
  procesar(texto);
}

async function iniciarCamara() {
  const z = $('#lector'); if (!z) return;
  z.classList.add('on');
  z.innerHTML = '<video id="video" playsinline muted autoplay></video><div class="guia"></div>';
  const video = $('#video');
  lector = true;
  const restricciones = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } };
  try {
    let nativo = false;
    if ('BarcodeDetector' in window) {
      try { nativo = (await BarcodeDetector.getSupportedFormats()).indexOf('ean_13') !== -1; } catch (e) {}
    }
    if (nativo) {
      // Detector del sistema (Chrome Android): lee en cualquier ángulo.
      lectorStream = await navigator.mediaDevices.getUserMedia(restricciones);
      video.srcObject = lectorStream;
      await video.play();
      const det = new BarcodeDetector({ formats: FORMATOS_NATIVOS });
      let ocupado = false;
      lectorTimer = setInterval(async () => {
        if (!leyendo || ocupado || video.readyState < 2 || lecturaPausada) return;
        ocupado = true;
        try { const r = await det.detect(video); if (r.length) onCodigoCamara(r[0].rawValue); } catch (e) {}
        ocupado = false;
      }, 100);
    } else {
      // iPhone: analiza el centro de cada cuadro rotado en 0, ±20 y ±40 grados; TRY_HARDER suma el giro de 90,
      // así cubre cualquier ángulo de la etiqueta (probado de 0 a 355 grados).
      if (!window.ZXing) throw new Error('lector no disponible');
      const Z = ZXing;
      const hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      const lectorZ = new Z.MultiFormatReader();
      lectorZ.setHints(hints);
      lectorStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
      try { const pista = lectorStream.getVideoTracks()[0]; const cap = pista.getCapabilities ? pista.getCapabilities() : {}; if (cap.focusMode && cap.focusMode.indexOf('continuous') !== -1) await pista.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
      video.srcObject = lectorStream;
      await video.play();
      const lienzo = document.createElement('canvas');
      const ctx = lienzo.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const angulos = [0, 20, -20, 40, -40];
      let k = 0;
      lectorTimer = setInterval(() => {
        if (!leyendo || video.readyState < 2 || lecturaPausada) return;
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;
        const lado = Math.min(vw, vh) * 0.85, sx = (vw - lado) / 2, sy = (vh - lado) / 2, S = 900;
        lienzo.width = S; lienzo.height = S;
        const ang = angulos[k++ % angulos.length] * Math.PI / 180;
        ctx.save();
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
        ctx.translate(S / 2, S / 2); ctx.rotate(ang);
        ctx.drawImage(video, sx, sy, lado, lado, -S / 2, -S / 2, S, S);
        ctx.restore();
        try {
          const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(lienzo)));
          const res = lectorZ.decode(bmp);
          if (res) onCodigoCamara(res.getText());
        } catch (e) {}
      }, 80);
    }
    const b = $('#btnCamara'); if (b) b.textContent = 'Detener';
  } catch (err) {
    detenerCamara();
    aviso('error', 'La cámara no está disponible', 'Revisa el permiso de cámara del navegador. Mientras, usa la pistola o escribe el código. (' + (err && err.name || err) + ')');
  }
}

function detenerCamara() {
  if (typeof marcarLectura === 'function') marcarLectura(false);
  if (!lector) return;
  lector = null;
  if (lectorTimer) { clearInterval(lectorTimer); lectorTimer = null; }
  if (zxReader) { try { zxReader.reset(); } catch (e) {} zxReader = null; }
  if (lectorStream) { lectorStream.getTracks().forEach(t => t.stop()); lectorStream = null; }
  const z = $('#lector'); if (z) { z.classList.remove('on'); z.innerHTML = ''; }
  const b = $('#btnCamara'); if (b) b.textContent = 'Cámara';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function pedirPermisoCamara() {
  if (!videoDisponible() || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => s.getTracks().forEach(t => t.stop()))
    .catch(() => {});
}

function pantallaClave(msg) {
  $('#pie').hidden = true;
  app.innerHTML = `<div class="vacio"><strong>Clave de acceso</strong>Ingrésala una sola vez en este celular.
    ${msg ? '<br><span class="sin">' + esc(msg) + '</span>' : ''}
    <form id="formClave" style="margin:16px auto 0;display:grid;gap:8px;max-width:320px">
      <input id="inClave" type="password" autocomplete="current-password" aria-label="Clave de acceso" style="padding:12px;font-size:18px;border:1px solid var(--linea)">
      <button style="padding:12px;background:var(--rojo);color:#fff;border:0;font-weight:600">Entrar</button>
    </form></div>`;
  $('#formClave').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('#inClave').value.trim();
    if (!v) return;
    llamarApi('verificarClave', [], v).then(() => {
      try { localStorage.setItem('claveAppOXS', v); } catch (_) {}
      reiniciar();
      pedirPermisoCamara();
    }).catch(err => pantallaClave(err.message));
  });
}

if (!claveApp()) pantallaClave(); else pedirPermisoCamara();

document.addEventListener('click', (e) => {
  if (!doc || $('#modal').classList.contains('on')) return;
  if (e.target.closest('input, .tipo, .modos, #formBuscar, #barraBodega, #pallets, #formClave')) return;
  setTimeout(enfocar, 0);
});
